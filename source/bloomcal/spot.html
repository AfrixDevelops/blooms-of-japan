<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blooms of Japan — Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* the skeleton that index.html gets for free — this page is served as written */
  img{ max-width:100%; }
  [hidden]{ display:none !important; }

  /* this page is a document, not an overlay */
  .detail{ position:static; opacity:1; pointer-events:auto; background:transparent; overflow:visible; }
  .crumbs{ max-width:1180px; margin:0 auto; padding:20px 26px 0; font-size:12.5px; color:var(--faint); }
  .crumbs a{ text-decoration:none; }
  .crumbs a:hover{ color:var(--coral); }
  .nearby{ max-width:1180px; margin:0 auto; padding:10px 26px 70px; }
  .nearby h3{ font-size:20px; font-weight:800; margin-bottom:14px; }
  .nearby .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .missing{ max-width:640px; margin:70px auto; text-align:center; }
  .missing h2{ font-size:26px; font-weight:800; margin-bottom:8px; }
  .missing p{ color:var(--muted); font-size:15px; }
</style>
</head>
<body>

<header class="bar">
  <a href="index.html" style="display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(16,16)">
      <g fill="#F0796B"><ellipse cx="0" cy="-8" rx="5" ry="7.5"/><ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(72)"/><ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(144)"/><ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(216)"/><ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(288)"/></g>
      <circle r="3.6" fill="#E9B44C"/></g></svg>
    <span class="bn">Blooms of Japan</span>
  </a>
  <nav><a href="index.html">The year</a><a href="index.html#tool">Browse spots</a><a href="index.html#tool">Plan a trip</a></nav>
</header>

<div id="page"></div>

<script src="data.js"></script>
<script>
const MON = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
const realMonth = new Date().getMonth() + 1;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function statusLine(m){
  const d = (m - realMonth + 12) % 12;
  if(d === 0) return 'Blooming now — this is the week.';
  if(d === 1) return 'Coming soon, about a month out.';
  if(d === 11) return 'Just finished for this year.';
  return `About ${d} months away. Typical window, shifts with the season.`;
}

const slug = new URLSearchParams(location.search).get('s');
const f = (window.D && D.feat || []).find(x => x.slug === slug);
document.title = f ? `${f.name} — Blooms of Japan` : 'Spot not found — Blooms of Japan';

const page = document.getElementById('page');

if(!f){
  page.innerHTML = `<div class="missing">
    <h2>We don't have that spot yet</h2>
    <p>It may not be in this sketch's sample. <a href="index.html">Back to the year</a>.</p>
  </div>`;
} else {
  const near = D.feat.filter(x => x.slug !== f.slug && x.region === f.region).slice(0, 3);
  page.innerHTML = `
  <nav class="crumbs">
    <a href="index.html">Home</a> › <a href="index.html">${MON[f.m]}</a> › ${esc(f.name)}
  </nav>

  <div class="detail">
    <div class="dwrap">
      <div class="dmain">
        <h2>${esc(f.name)}</h2>
        <div class="dsub">${esc(f.jp)} · ${esc(f.flower.replace(/\s*\(.*?\)/,''))} · ${esc(f.region)}</div>
        <div class="dhero"><img src="${f.img}" alt="${esc(f.name)}"></div>
        ${f.gal && f.gal.length ? `<div class="dthumbs">${f.gal.map(g=>`<img src="${g.i}" alt="" loading="lazy">`).join('')}</div>` : ''}
        <div class="dblock"><h3>About this spot</h3><p>${esc(f.desc)}</p></div>
        <div class="dblock">
          <h3>Getting there</h3>
          <div class="dfacts">
            ${f.station ? `<div class="dfact"><div class="k">Nearest station</div><div class="v">${esc(f.station)}</div></div>` : ''}
            <div class="dfact"><div class="k">Address</div><div class="v">${esc(f.address)}</div></div>
            <div class="dfact"><div class="k">Show this at the station</div><div class="v">${esc(f.jp || f.name)}</div></div>
          </div>
        </div>
      </div>

      <aside class="dside">
        <div class="dbox">
          <h4>Best time to go</h4>
          <div class="pk">${esc(f.peak)}</div>
          <p>${statusLine(f.m)}</p>
        </div>
        <div class="dbox">
          <h4>Email me when it peaks</h4>
          <p>One message a few days before this spot hits its best week.</p>
          <div class="dfield">
            <input type="email" placeholder="you@example.com" aria-label="Email address">
            <button onclick="this.textContent='Done'">Notify</button>
          </div>
        </div>
        <div class="dbox partner">
          <small>Partner</small>
          <a>Japan Rail Pass — covers getting here ›</a>
          <a>Small-group tours near ${esc(f.region)} ›</a>
        </div>
        <div class="dbox">
          <h4>Blooms of Japan Pro</h4>
          <p>Ad-free, offline access and alerts for every spot you save. ¥700 for a 30-day trip pass.</p>
        </div>
      </aside>
    </div>
  </div>

  ${near.length ? `<section class="nearby">
    <h3>Nearby in ${esc(f.region)}</h3>
    <div class="grid">${near.map(n=>`
      <a class="card" href="spot.html?s=${n.slug}">
        <img src="${n.img}" alt="${esc(n.name)}" loading="lazy">
        <div class="cb"><h4>${esc(n.name)}</h4>
          <div class="mt"><span>${esc(n.flower.replace(/\s*\(.*?\)/,''))}</span><span>${MON[n.m]}</span></div>
        </div>
      </a>`).join('')}</div>
  </section>` : ''}`;
}
</script>

</body>
</html>
